<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Control tower · SULOai</title>
  <meta name="description" content="SULOai control tower for shipment visibility, dispatch, and last-mile delivery from the Jebel Ali origin hub.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="brand/suloai-mark.png">
</head>
<body>
  <a class="skip" href="#stage">Skip to operations</a>
  <svg class="grain" aria-hidden="true">
    <filter id="grain-filter">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" stitchTiles="stitch"/>
    </filter>
    <rect width="100%" height="100%" filter="url(#grain-filter)"/>
  </svg>
  <p class="sr-only" id="live-region" aria-live="polite"></p>
  <div class="app">
    <aside class="rail" aria-label="Primary">
      <div class="brand">
        <img class="mark-logo" src="brand/suloai-mark.png" alt="">
        <div>
          <strong>SULOai</strong>
          <em>Control tower</em>
        </div>
      </div>
      <nav class="rail-nav">
        <span class="glider" aria-hidden="true"></span>
        <a class="rail-link" href="#dashboard" data-view="dashboard">
          <span class="idx">01</span>
          <span class="copy"><b>Control tower</b><small>Network overview</small></span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 14V6M10 18V4M16 14V8M22 18V10"/></svg>
        </a>
        <a class="rail-link" href="#tracking" data-view="tracking">
          <span class="idx">02</span>
          <span class="copy"><b>Shipment tracking</b><small>38 out for delivery</small></span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="6" cy="17" r="2.2"/><circle cx="18" cy="7" r="2.2"/><path d="M8 16c2.5-4 5-8 8-8"/></svg>
        </a>
      </nav>
      <div class="rail-spacer"></div>
      <div class="ai-slot">
        <section class="ai-panel" id="ai-panel" hidden>
          <div class="ai-log" id="ai-log">
            <p class="ai-answer">Ask about live shipments, proof of delivery, or exceptions.</p>
          </div>
          <form id="ai-form">
            <input id="ai-input" type="text" placeholder="Ask SULOai" aria-label="Ask SULOai">
            <button type="submit" aria-label="Send">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            </button>
          </form>
        </section>
        <button class="ai-bot" id="ai-bot" type="button" aria-expanded="false" aria-controls="ai-panel">
          <img src="brand/suloai-mark.png" alt="">
          <span><b>SULOai</b><small>Ask the tower</small></span>
        </button>
      </div>
      <div class="operator">
        <span class="avatar" aria-hidden="true">NA</span>
        <div>
          <b>N. Al Farsi</b>
          <small>Operations supervisor</small>
        </div>
        <span class="presence" aria-hidden="true"></span>
      </div>
    </aside>
    <main class="stage" id="stage" tabindex="-1"></main>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script type="module" src="js/app.js?v=14"></script>
</body>
</html>
